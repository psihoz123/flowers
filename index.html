<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Для Влады ❤️</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(145deg, #fce4ec 0%, #f8bbd0 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        body::before {
            content: '';
            position: absolute;
            top: -50px;
            left: -50px;
            width: 200px;
            height: 200px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            pointer-events: none;
        }

        body::after {
            content: '';
            position: absolute;
            bottom: -80px;
            right: -60px;
            width: 280px;
            height: 280px;
            background: rgba(255, 240, 245, 0.4);
            border-radius: 50%;
            pointer-events: none;
        }

        .card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 56px;
            padding: 48px 40px;
            max-width: 600px;
            width: 100%;
            text-align: center;
            box-shadow: 0 25px 50px -10px rgba(180, 80, 120, 0.25),
                        0 0 0 1px rgba(255, 255, 255, 0.6) inset;
            transition: all 0.3s ease;
            animation: softAppear 0.9s cubic-bezier(0.2, 0.9, 0.3, 1) forwards;
            position: relative;
            z-index: 10;
        }

        @keyframes softAppear {
            0% { opacity: 0; transform: scale(0.92) translateY(20px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }

        h1 {
            font-size: 3rem;
            font-weight: 500;
            letter-spacing: -0.5px;
            color: #4a2c3a;
            margin-bottom: 12px;
            line-height: 1.2;
        }

        .name {
            display: inline-block;
            background: linear-gradient(135deg, #b84a6b, #d46c8a);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            font-weight: 700;
            position: relative;
        }

        .subhead {
            font-size: 1.2rem;
            color: #5f3e4b;
            opacity: 0.8;
            margin-bottom: 40px;
            font-weight: 400;
            letter-spacing: 0.3px;
            border-bottom: 1px dashed #e5b3c4;
            display: inline-block;
            padding-bottom: 8px;
        }

        .question {
            font-size: 1.8rem;
            font-weight: 500;
            color: #4a2c3a;
            margin: 30px 0 28px;
            line-height: 1.3;
            text-shadow: 0 2px 4px rgba(255, 255, 255, 0.8);
        }

        .buttons {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
            margin: 10px 0 20px;
        }

        .btn {
            border: none;
            outline: none;
            cursor: pointer;
            padding: 16px 48px;
            font-size: 1.5rem;
            font-weight: 600;
            border-radius: 60px;
            transition: all 0.25s ease;
            box-shadow: 0 12px 24px -8px rgba(150, 70, 100, 0.3);
            letter-spacing: 0.5px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 160px;
            border: 2px solid transparent;
            background: white;
        }

        .btn-yes {
            background: linear-gradient(135deg, #e0638c, #c94f75);
            color: white;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.1);
            box-shadow: 0 14px 24px -10px #b8456b, 0 0 0 1px rgba(255, 255, 255, 0.3) inset;
        }

        .btn-yes:hover {
            background: linear-gradient(135deg, #e8769b, #d45f84);
            transform: scale(1.03) translateY(-3px);
            box-shadow: 0 20px 28px -10px #b8456b;
        }

        .btn-yes:active {
            transform: scale(0.98) translateY(2px);
            box-shadow: 0 8px 16px -6px #b8456b;
        }

        .btn-no {
            background: #f6e7ed;
            color: #7a4a5e;
            border: 2px solid #f0cedb;
            box-shadow: 0 8px 18px -8px #d9b1c1;
        }

        .btn-no:hover {
            background: #faeef3;
            color: #b3486b;
            border-color: #e8b6c8;
            transform: scale(1.03) translateY(-3px);
            box-shadow: 0 16px 24px -10px #d9b1c1;
        }

        .btn-no:active {
            transform: scale(0.98) translateY(2px);
            background: #f2dfe7;
        }

        /* Блок для сообщения */
        .message-area {
            min-height: 90px;
            margin-top: 28px;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .thank-message {
            background: rgba(255, 250, 240, 0.9);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            padding: 22px 28px;
            border-radius: 40px;
            font-size: 1.5rem;
            font-weight: 500;
            color: #3f2a32;
            line-height: 1.5;
            box-shadow: 0 20px 30px -12px rgba(190, 110, 140, 0.4),
                        0 0 0 1px #fff8fc inset;
            border: 1px solid rgba(255, 220, 235, 0.8);
            animation: messagePop 0.45s cubic-bezier(0.25, 1.2, 0.5, 1);
            max-width: 500px;
            margin: 0 auto;
            word-break: break-word;
        }

        @keyframes messagePop {
            0% { opacity: 0; transform: scale(0.8) translateY(12px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }

        .thank-message span {
            display: inline-block;
            background: linear-gradient(145deg, #b3486b, #d4557a);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            font-weight: 600;
        }

        .thank-message::before {
            content: '🌸';
            margin-right: 10px;
            font-size: 1.7rem;
            filter: drop-shadow(0 2px 4px rgba(200, 100, 130, 0.3));
        }

        /* приятный пустой блок без сообщения */
        .empty-message {
            opacity: 0.5;
            font-size: 1rem;
            color: #a06d82;
            font-style: italic;
            letter-spacing: 0.3px;
            transition: 0.3s;
        }

        .footer-note {
            margin-top: 30px;
            font-size: 0.9rem;
            color: #a17a8b;
            letter-spacing: 0.5px;
            opacity: 0.8;
            border-top: 1px solid rgba(220, 170, 190, 0.3);
            padding-top: 20px;
        }

        .heart {
            color: #d4557a;
            animation: heartbeat 1.6s infinite;
            display: inline-block;
        }

        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            30% { transform: scale(1.2); }
            60% { transform: scale(1); }
        }

        @media (max-width: 500px) {
            .card {
                padding: 32px 20px;
                border-radius: 40px;
            }
            h1 {
                font-size: 2.2rem;
            }
            .question {
                font-size: 1.4rem;
            }
            .btn {
                padding: 14px 28px;
                font-size: 1.3rem;
                min-width: 120px;
            }
            .thank-message {
                font-size: 1.2rem;
                padding: 18px 16px;
            }
            .buttons {
                gap: 12px;
            }
        }

        @media (max-width: 380px) {
            .buttons {
                flex-direction: column;
                align-items: center;
            }
            .btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>
            <span class="name">Привет, Влада</span>
        </h1>

        <div class="question">Ты получила подарок?</div>

        <div class="buttons">
            <button class="btn btn-yes" id="yesBtn">Да</button>
            <button class="btn btn-no" id="noBtn">Нет</button>
        </div>

        <div class="message-area" id="messageArea">
            <div class="empty-message">✨ твой ответ появится здесь ✨</div>
        </div>
    </div>

    <script>
        (function() {
            const yesBtn = document.getElementById('yesBtn');
            const noBtn = document.getElementById('noBtn');
            const messageArea = document.getElementById('messageArea');

            const yesMessage = 'надеюсь я смог поднять тебе настроение на день... 🌷';
            const noMessage = 'не надо обманывать';

            function showMessage(text, isYes = false) {
                messageArea.innerHTML = '';
                
                const msgDiv = document.createElement('div');
                msgDiv.className = 'thank-message';
                
                if (isYes) {
                    const parts = text.split(' ');
                    msgDiv.textContent = text;
                } else {
                    msgDiv.textContent = text;
                }
                
                messageArea.appendChild(msgDiv);
            }

            yesBtn.addEventListener('click', function(e) {
                e.preventDefault();
                showMessage(yesMessage, true);
            });

            noBtn.addEventListener('click', function(e) {
                e.preventDefault();
                showMessage(noMessage, false);
            });

            function hapticFeedback() {
                if (window.navigator && window.navigator.vibrate) {
                    window.navigator.vibrate(10);
                }
            }

            yesBtn.addEventListener('click', hapticFeedback);
            noBtn.addEventListener('click', hapticFeedback);
        })();
    </script>
</body>
</html>
